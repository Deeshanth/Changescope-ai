services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: changescope-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/changescope.db
      ALLOWED_REPO_ROOTS: /repos
      MAX_SOURCE_FILE_BYTES: 2000000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - changescope_data:/data
      - ${HOST_REPOS_DIR:-./}:/repos:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: changescope-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  changescope_data:
